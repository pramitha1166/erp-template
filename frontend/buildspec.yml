version: 0.2

# Runs inside AWS CodeBuild (infra/modules/codebuild), triggered by
# .github/workflows/deploy.yml after CI passes on main. Not used locally —
# see frontend/Dockerfile for that.

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - echo "Building frontend image $ECR_REGISTRY/$IMAGE_REPO_NAME:$IMAGE_TAG..."
      - docker build -t "$ECR_REGISTRY/$IMAGE_REPO_NAME:$IMAGE_TAG" -t "$ECR_REGISTRY/$IMAGE_REPO_NAME:staging" .
  post_build:
    commands:
      - echo "Pushing images..."
      - docker push "$ECR_REGISTRY/$IMAGE_REPO_NAME:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/$IMAGE_REPO_NAME:staging"
      - echo "Rolling ECS deployment..."
      - aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE_NAME" --force-new-deployment
      - aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME"
