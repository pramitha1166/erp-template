name: CI

on:
  push:
    branches: [claude/srs-review-breakdown-49ecvy]
  pull_request:

jobs:
  backend:
    name: Backend (build, test, ArchUnit, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eudext_erp
          POSTGRES_USER: eudext
          POSTGRES_PASSWORD: eudext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eudext -d eudext_erp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unit tests, ArchUnit module-boundary rules (ARCH-1), the ARCH-5
      # double/float ban, Spring Modulith verification, Testcontainers
      # integration tests (NFR-M2), and the statutory-package JaCoCo
      # coverage gate (SRS §4.6) all run under the standard `verify` phase.
      - name: mvn verify
        run: mvn -B verify

      - name: Publish JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco

      # NFR-M4: OpenAPI generated from code, published as a build artifact.
      - name: Generate OpenAPI spec
        env:
          DB_URL: jdbc:postgresql://localhost:5432/eudext_erp
          DB_USERNAME: eudext
          DB_PASSWORD: eudext
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: mvn -B -Popenapi verify -DskipTests

      - name: Publish OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/target/openapi.yaml

      # NFR-S3: dependency/CVE scan, failing the build on high-severity
      # (CVSS >= 7) findings. Requires an NVD_API_KEY repository secret
      # (https://nvd.nist.gov/developers/request-an-api-key) — without one
      # NVD's public rate limits make the scan too slow/flaky to gate CI on,
      # so this step is skipped (not silently "passed") until the secret is
      # added. See CLAUDE.md's Commands section.
      - name: Dependency / CVE scan
        if: ${{ env.NVD_API_KEY != '' }}
        run: >-
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7 -DnvdApiKey=$NVD_API_KEY

      - name: Publish dependency-check report
        if: ${{ env.NVD_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html

  frontend:
    name: Frontend (lint, typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # NFR-S3: dependency/CVE scan for the frontend. audit-ci.jsonc carries
      # a narrow, documented allowlist for the one currently-unfixable
      # advisory (postcss bundled inside next@15.5.23) — see that file.
      - run: npm run audit:ci
