name: Deploy

# Fires after CI goes green on main — never builds/deploys an image that
# hasn't passed backend+frontend CI first.
#
# This job intentionally does almost nothing itself: it zips the source and
# hands it to AWS CodeBuild (infra/modules/codebuild), which does the
# actual `docker build`, ECR push, and ECS redeploy on AWS compute. That
# keeps GitHub Actions minutes spent on a deploy down to the time it takes
# to zip two directories and poll an API — seconds, not the several minutes
# a Maven + npm Docker build takes.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write # required for AWS OIDC federation — no long-lived keys
  contents: read

jobs:
  trigger-build:
    if: github.event.workflow_run.conclusion == 'success'
    name: Trigger AWS CodeBuild (staging)
    runs-on: ubuntu-latest
    environment: staging
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BUCKET: eudext-erp-staging-build-source
      BACKEND_PROJECT: eudext-erp-staging-backend
      FRONTEND_PROJECT: eudext-erp-staging-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Zip and upload source
        run: |
          (cd backend && zip -rq ../backend-src.zip . -x '.git/*')
          (cd frontend && zip -rq ../frontend-src.zip . -x '.git/*' -x 'node_modules/*' -x '.next/*')
          aws s3 cp backend-src.zip "s3://${SOURCE_BUCKET}/backend/${SHA}.zip"
          aws s3 cp frontend-src.zip "s3://${SOURCE_BUCKET}/frontend/${SHA}.zip"

      - name: Start builds
        id: start
        run: |
          backend_id=$(aws codebuild start-build \
            --project-name "$BACKEND_PROJECT" \
            --source-type-override S3 \
            --source-location-override "${SOURCE_BUCKET}/backend/${SHA}.zip" \
            --environment-variables-override name=IMAGE_TAG,value="$SHA",type=PLAINTEXT \
            --query 'build.id' --output text)
          frontend_id=$(aws codebuild start-build \
            --project-name "$FRONTEND_PROJECT" \
            --source-type-override S3 \
            --source-location-override "${SOURCE_BUCKET}/frontend/${SHA}.zip" \
            --environment-variables-override name=IMAGE_TAG,value="$SHA",type=PLAINTEXT \
            --query 'build.id' --output text)
          echo "backend_id=$backend_id" >> "$GITHUB_OUTPUT"
          echo "frontend_id=$frontend_id" >> "$GITHUB_OUTPUT"
          echo "Started backend build: $backend_id"
          echo "Started frontend build: $frontend_id"

      - name: Wait for both builds to finish
        env:
          BACKEND_ID: ${{ steps.start.outputs.backend_id }}
          FRONTEND_ID: ${{ steps.start.outputs.frontend_id }}
        run: |
          terminal_statuses="SUCCEEDED FAILED FAULT TIMED_OUT STOPPED"
          backend_status="IN_PROGRESS"
          frontend_status="IN_PROGRESS"

          while true; do
            statuses=$(aws codebuild batch-get-builds --ids "$BACKEND_ID" "$FRONTEND_ID" \
              --query 'builds[].{id:id,status:buildStatus}' --output json)
            backend_status=$(echo "$statuses" | jq -r --arg id "$BACKEND_ID" '.[] | select(.id==$id) | .status')
            frontend_status=$(echo "$statuses" | jq -r --arg id "$FRONTEND_ID" '.[] | select(.id==$id) | .status')
            echo "backend: $backend_status | frontend: $frontend_status"

            backend_done=false; frontend_done=false
            for s in $terminal_statuses; do
              [ "$backend_status" = "$s" ] && backend_done=true
              [ "$frontend_status" = "$s" ] && frontend_done=true
            done
            if [ "$backend_done" = true ] && [ "$frontend_done" = true ]; then
              break
            fi
            sleep 15
          done

          echo "Final: backend=$backend_status frontend=$frontend_status"
          if [ "$backend_status" != "SUCCEEDED" ] || [ "$frontend_status" != "SUCCEEDED" ]; then
            echo "One or both builds did not succeed. See CodeBuild logs (CloudWatch: /codebuild/eudext-erp-staging-backend, /codebuild/eudext-erp-staging-frontend)."
            exit 1
          fi
