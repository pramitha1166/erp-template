name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write # required for AWS OIDC federation — no long-lived keys
  contents: read

env:
  TERRAFORM_VERSION: "1.15.9"

jobs:
  # Runs on every PR touching infra/. Trusted for any ref (see
  # infra/bootstrap), read-only AWS permissions — safe to run unattended.
  plan:
    if: github.event_name == 'pull_request'
    name: terraform plan (staging)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=staging/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"

      - run: terraform fmt -check -recursive .
        working-directory: infra

      - run: terraform validate

      - run: terraform plan -no-color -input=false

  # Runs only on merge to main, and only after anyone required by the
  # "staging" GitHub Environment approves — see infra/README.md for setting
  # that up. This role can create/modify/destroy most of the AWS footprint,
  # so it is deliberately never available on a PR.
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: terraform apply (staging)
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=staging/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"

      - run: terraform apply -auto-approve -input=false
