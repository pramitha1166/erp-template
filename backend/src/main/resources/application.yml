spring:
  application:
    name: erp-backend
  jpa:
    open-in-view: false
    hibernate:
      # ARCH-7: schema is owned exclusively by Flyway migrations, in every
      # environment including local dev. Never set this to anything but none.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eudext_erp}
    username: ${DB_USERNAME:eudext}
    password: ${DB_PASSWORD:eudext}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  servlet:
    # All routes behind /api — lets the ALB path-route "/api/*" to this
    # service and everything else to the frontend on the same listener
    # (infra/modules/alb).
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eudext:
  jwt:
    # IAM-1: HS256 signing key. This default is for local dev/tests ONLY —
    # every real environment must override JWT_SECRET with a random value
    # of at least 32 bytes (HS256 requires a >=256-bit key).
    secret: ${JWT_SECRET:dev-only-secret-key-not-for-production-use-32-bytes-min}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  audit:
    archive:
      # AUD-5: off by default — no environment needs a reachable
      # S3-compatible endpoint just to boot. The docker profile turns this
      # on against the local MinIO instance; staging/production override
      # these via env vars against real S3.
      enabled: false
      s3-endpoint: ${AUDIT_ARCHIVE_S3_ENDPOINT:}
      region: ${AUDIT_ARCHIVE_S3_REGION:us-east-1}
      bucket: ${AUDIT_ARCHIVE_S3_BUCKET:eudext-audit-archive}
      access-key: ${AUDIT_ARCHIVE_S3_ACCESS_KEY:}
      secret-key: ${AUDIT_ARCHIVE_S3_SECRET_KEY:}
      retention-before-archive: P2Y
      tenant-ids: []
