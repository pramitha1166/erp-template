spring:
  application:
    name: erp-backend
  jpa:
    open-in-view: false
    hibernate:
      # ARCH-7: schema is owned exclusively by Flyway migrations, in every
      # environment including local dev. Never set this to anything but none.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eudext_erp}
    username: ${DB_USERNAME:eudext}
    password: ${DB_PASSWORD:eudext}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
